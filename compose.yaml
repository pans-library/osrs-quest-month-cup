services:
  cup:
    image: ghcr.io/pans-library/osrs-quest-month-cup:latest
    # To build from source instead, replace the line above with:  build: .
    restart: unless-stopped
    # Only the cup's own settings; the tunnel token stays with cloudflared.
    environment:
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?set WEBHOOK_TOKEN in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      CUP_START: ${CUP_START:-2026-11-01T00:00:00Z}
      SCORING: ${SCORING:-}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
          pids: 100
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data:/data
    # Uncomment to reach the page on your LAN without the tunnel (http://<host>:8080)
    # ports:
    #   - "8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - cup
